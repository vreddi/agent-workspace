# Worktrunk config for the agent-workspace monorepo.
# Runs after `wt switch --create` lands in a fresh worktree.

[hooks]
post-start = """
set -e
cd "$WT_PATH"

# 1. Symlink env files from the canonical store (~/.config/agent-workspace).
#    Shared with the Claude Code worktree hooks in .claude/settings.json;
#    add new env files inside the script.
bash scripts/link-worktree-env.sh

# 2. Install workspace deps (fast — pnpm hardlinks from the global store).
pnpm install --frozen-lockfile

# 3. Generate Convex types so the editor resolves @convex/_generated/* on first open.
pnpm exec convex codegen >/dev/null 2>&1 || true

echo "worktree ready — try: pnpm dev:web"
"""
