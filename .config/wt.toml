# Worktrunk config for the agent-workspace monorepo.
# Runs after `wt switch --create` lands in a fresh worktree.

[hooks]
post-start = """
set -e
cd "$WT_PATH"

# 1. Symlink env files from the canonical store (~/.config/agent-workspace).
#    Add new lines here when more apps need their own .env.local.
ENV_HOME="$HOME/.config/agent-workspace"
link_env() {
  local target="$1"   # canonical filename inside $ENV_HOME
  local dest="$2"     # path inside the worktree
  if [ -e "$ENV_HOME/$target" ] && [ ! -e "$dest" ]; then
    mkdir -p "$(dirname "$dest")"
    ln -s "$ENV_HOME/$target" "$dest"
    echo "linked $dest -> $ENV_HOME/$target"
  fi
}
link_env web.env.local apps/web/.env.local

# 2. Install workspace deps (fast — pnpm hardlinks from the global store).
pnpm install --frozen-lockfile

# 3. Generate Convex types so the editor resolves @convex/_generated/* on first open.
pnpm exec convex codegen >/dev/null 2>&1 || true

echo "worktree ready — try: pnpm dev:web"
"""
