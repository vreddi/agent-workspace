packages:
  - apps/*
  - examples/*
  - packages/*

# pnpm 11 requires an explicit decision for every dependency that ships a
# build (postinstall) script. All of these ship prebuilt platform binaries,
# so the scripts are not needed — the full build, test, and deploy all pass
# with them ignored. Set to `false` (do not run) to keep that behavior and
# avoid running arbitrary install-time code. Flip an entry to `true` only if a
# package turns out to genuinely need its build step.
allowBuilds:
  '@clerk/shared': false
  '@swc/core': false
  browser-tabs-lock: false
  bufferutil: false
  core-js: false
  esbuild: false
  msgpackr-extract: false
  msw: false
  nx: false
  sharp: false
  unrs-resolver: false
  utf-8-validate: false
  workerd: false

catalog:
  # React: pinned to the exact version Expo SDK 57 / react-native 0.86 expect
  # (apps/mobile). The web/storybook ^19.0.0 ranges are satisfied by this too,
  # so a single cataloged version keeps every surface on the same React.
  react: 19.2.7
  react-dom: 19.2.7
  '@types/react': ^19.2.17
  # Toolchain shared across every project.
  typescript: ~5.9.2
  tailwindcss: ^4.3.3
  '@vitejs/plugin-react': ^5.0.0
  vite: 7.3.3
  vitest: 4.1.10
  # Storybook 10 stack.
  storybook: ^10.5.2
  '@storybook/react-vite': ^10.5.2
  '@storybook/addon-docs': ^10.5.2
  # Misc shared libs.
  pixi.js: ^8.19.0
  tsdown: ^0.22.9
