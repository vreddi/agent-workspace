# Manually deploy apps/web to Cloudflare Workers.
#
# Two release branches map to two isolated Cloudflare Workers:
#   develop → Dogfood     worker: org-web-todo-dogfood
#   prod    → production  worker: org-web-todo
#
# Pick the target from the "environment" input when dispatching. Each target
# reads its own GitHub Environment secrets (Settings → Environments), so every
# secret below must be set in BOTH the "Dogfood" and "production" environments:
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID
#   CLERK_SECRET_KEY
#   VITE_CLERK_PUBLISHABLE_KEY
#   VITE_CONVEX_URL
name: deploy-web

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Release environment to deploy
        type: choice
        options:
          - Dogfood
          - production
        default: Dogfood

run-name: deploy-web → ${{ inputs.environment }}

concurrency:
  group: deploy-web-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy @org/web → ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      # develop feeds Dogfood; prod feeds production.
      - name: Checkout release branch
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.environment == 'production' && 'prod' || 'develop' }}
          fetch-depth: 0

      # Provision pnpm from the packageManager field via Corepack (bundled with
      # Node). Enabled before setup-node so its `cache: pnpm` can find pnpm.
      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      # --name overrides the worker in wrangler.jsonc so each environment
      # deploys to its own isolated Worker and they never overwrite each other.
      - name: Build and deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
          CLOUDFLARE_INCLUDE_PROCESS_ENV: true
          WORKER_NAME: ${{ inputs.environment == 'production' && 'org-web-todo' || 'org-web-todo-dogfood' }}
        run: pnpm exec vite build && pnpm exec wrangler deploy --name "$WORKER_NAME"
