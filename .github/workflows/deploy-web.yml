# Manually deploy apps/web to Cloudflare Workers.
#
# Two release branches map to two isolated Cloudflare Workers:
#   develop → Dogfood     worker: org-web-todo-dogfood
#   prod    → production  worker: org-web-todo
#
# Pick the target from the "environment" input when dispatching. Each target
# reads its own GitHub Environment secrets (Settings → Environments), so every
# secret below must be set in BOTH the "Dogfood" and "production" environments:
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID
#   CLERK_SECRET_KEY
#   VITE_CLERK_PUBLISHABLE_KEY
#   VITE_CONVEX_URL
#   CLERK_JWT_ISSUER_DOMAIN
#
# These feed two distinct places, which is the subtlety that bit us before:
#   - BUILD time: VITE_* are baked into the client bundle by `vite build`.
#   - RUNTIME:    the Worker's SSR needs CLERK_SECRET_KEY et al. as Worker
#                 bindings. `wrangler deploy` does NOT carry the job's env onto
#                 the Worker, so we set them explicitly below (secret + vars).
name: deploy-web

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Release environment to deploy
        type: choice
        options:
          - Dogfood
          - production
        default: Dogfood

run-name: deploy-web → ${{ inputs.environment }}

concurrency:
  group: deploy-web-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy @org/web → ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      # develop feeds Dogfood; prod feeds production.
      - name: Checkout release branch
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.environment == 'production' && 'prod' || 'develop' }}
          fetch-depth: 0

      # Provision pnpm from the packageManager field via Corepack (bundled with
      # Node). Enabled before setup-node so its `cache: pnpm` can find pnpm.
      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      # Bakes the VITE_* values into the client bundle. CI=true (set by Actions)
      # makes env.ts skip validation here; the real check runs on the Worker.
      - name: Build web app
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
        run: pnpm exec vite build

      # `--name` overrides the worker in wrangler.jsonc so each environment
      # deploys to its own isolated Worker. `wrangler deploy` does NOT put the
      # job's env onto the Worker, so we provision runtime bindings explicitly:
      # public config as plaintext --var, the Clerk secret via `secret put`
      # (stdin, never logged). Without this the SSR Worker has no CLERK_SECRET_KEY
      # and every request 500s inside clerkMiddleware.
      - name: Deploy to Cloudflare and provision runtime bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
          CLERK_JWT_ISSUER_DOMAIN: ${{ secrets.CLERK_JWT_ISSUER_DOMAIN }}
          WORKER_NAME: ${{ inputs.environment == 'production' && 'org-web-todo' || 'org-web-todo-dogfood' }}
        run: |
          pnpm exec wrangler deploy --name "$WORKER_NAME" \
            --var "VITE_CONVEX_URL:$VITE_CONVEX_URL" \
            --var "VITE_CLERK_PUBLISHABLE_KEY:$VITE_CLERK_PUBLISHABLE_KEY" \
            --var "CLERK_JWT_ISSUER_DOMAIN:$CLERK_JWT_ISSUER_DOMAIN"
          printf '%s' "$CLERK_SECRET_KEY" \
            | pnpm exec wrangler secret put CLERK_SECRET_KEY --name "$WORKER_NAME"
